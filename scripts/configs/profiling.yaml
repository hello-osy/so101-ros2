project:
  run_name: smolvla_lora_offline_profile
  output_root: data/inference_logs

# 기록된 한 frame을 반복 사용한다. 로봇에는 명령을 보내지 않는다.
benchmark:
  dataset:
    repo_id: local/so101_pick_place
    root: data/collected_datasets/latest/dataset
  policy:
    path: data/training_outputs/latest/training/checkpoints/last/pretrained_model
    use_amp: true
  device: cuda
  sample_index: 0
  warmup_inferences: 2
  iterations: 20
  cuda_synchronize: true

profiling:
  nsys:
    trace: cuda,nvtx,osrt
    sample: none
  ncu:
    target_processes: all
    set: basic
    # 전체 kernel을 모두 재생하면 매우 느리므로 처음 N개만 측정한다.
    launch_count: 10
