project:
  run_name: smolvla_lora_pick_place
  output_root: data/training_outputs

# 다른 구조/LoRA 실험은 새 profile을 만든 뒤 이 한 줄만 바꾼다.
model_config: scripts/configs/models/smolvla_lora.yaml

lerobot:
  dataset:
    repo_id: local/so101_pick_place
    root: data/collected_datasets/latest/dataset
    use_imagenet_stats: true
    return_uint8: true
    eval_split: 0.0
  seed: 1000
  batch_size: 1
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: true
  steps: 10000
  log_freq: 20
  save_checkpoint: true
  save_freq: 2000
  env_eval_freq: 0
  eval_steps: 0
  use_policy_training_preset: true
  wandb:
    enable: false
    mode: offline
    project: so101-lora
