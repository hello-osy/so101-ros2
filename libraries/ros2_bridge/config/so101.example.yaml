so101_hardware:
  ros__parameters:
    # Prefer the stable name shown by: ls -l /dev/serial/by-id/
    port: "/dev/serial/by-id/CHANGE_ME"
    robot_id: "osy_so101_follower"
    # Empty means LeRobot's default calibration cache.
    calibration_dir: ""
    publish_rate_hz: 30.0
    max_relative_target_deg: 5.0
    max_start_delta_rad: 0.3490658504      # 20 degrees
    max_start_delta_gripper: 0.25
    max_step_delta_rad: 0.2617993878       # 15 degrees
    max_step_delta_gripper: 0.25
    # This is a JSON string because ROS parameters do not support arbitrary maps.
    camera_configs_json: >-
      {"wrist":{"device":"/dev/video0","fps":30,"width":640,"height":480,"fourcc":"MJPG"}}
